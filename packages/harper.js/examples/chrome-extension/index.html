<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Harper popup example</title>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<main>
			<h1>Harper popup</h1>
			<p>Lint text locally with <code>harper.js</code>.</p>

			<form id="lint-form">
				<label for="text">Text to check</label>
				<textarea id="text" rows="5">This is a example sentence.</textarea>
				<button type="submit" disabled>Check text</button>
			</form>

			<p id="status" role="status" aria-live="polite">Loading Harper…</p>
			<ul id="results" aria-label="Lint results"></ul>
		</main>
	</body>
</html>
